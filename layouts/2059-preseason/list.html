{{ define "main" }}
<article class="post-entry">
  <header class="entry-header">
    <h1>{{ .Title }}</h1>
  </header>

  <div class="entry-content">

    {{ if .Pages }}
    <h2>記事</h2>
    <ul>
      {{ range .Pages }}
      <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
      {{ end }}
    </ul>
    {{ end }}

  </div>
</article>
{{ end }}
